    <style>

        .idp-popover {

        .nav-part-btn.active {

        }

        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh / Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-black text-[#0f5132] tracking-wide">TRUNG TÂM NGOẠI NGỮ APLUS</h2>
                            <p className="text-xs text-gray-500 font-semibold uppercase tracking-wider">Kỳ Thi Tốt Nghiệp THPT Quốc Gia</p>
                            <h1 className="text-2xl font-black text-gray-800 mt-2">MÔN TIẾNG ANH - ĐỀ SỐ 07</h1>
                            <p className="text-xs text-gray-600 mt-1">Thời gian làm bài: 50 phút | Mã đề: 1126</p>
                        </div>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Mã số Thí sinh / Lớp</label>

                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="block w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#0f5132] focus:border-[#0f5132] text-sm" 
                                    placeholder="Ví dụ: 12A1 / TS2026"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="block w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#0f5132] focus:border-[#0f5132] text-sm" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>

                        <div className="mt-4 bg-amber-50 p-3 rounded-lg border border-amber-200 text-xs text-amber-800">
                            <strong>⚠️ Lưu ý kỳ thi:</strong> Bật chế độ Toàn màn hình (Fullscreen). Hệ thống sẽ tự động ghi nhận nếu thí sinh chuyển tab hoặc thoát màn hình làm bài.
                        </div>

                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3.5 rounded-lg font-bold hover:bg-[#0b3d26] transition-colors shadow-lg flex items-center justify-center space-x-2"
                        >
                            <span>BẮT ĐẦU LÀM BÀI (FULLSCREEN)</span>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>

        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(50 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [showWarningModal, setShowWarningModal] = useState(false);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');
            const [isNotesOpen, setIsNotesOpen] = useState(false);
            const [notesText, setNotesText] = useState('');

            // Resizable split pane width percentage
            const [leftWidth, setLeftWidth] = useState(48);
            const isResizing = useRef(false);

            const [popover, setPopover] = useState({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });

            const reEnterFullscreen = () => {
                const elem = document.documentElement;
                if (!document.fullscreenElement && elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleCloseWarningModal = () => {
                setShowWarningModal(false);
                reEnterFullscreen();
            };

            // Anti copy & context menu
            useEffect(() => {
                const preventDefault = (e) => e.preventDefault();
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                };
            }, []);

            // Resizer handlers
            const startResizing = useCallback((e) => {
                isResizing.current = true;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', stopResizing);
            }, []);

            const handleMouseMove = useCallback((e) => {
                if (!isResizing.current) return;
                const newWidth = (e.clientX / window.innerWidth) * 100;
                if (newWidth > 20 && newWidth < 80) {
                    setLeftWidth(newWidth);
                }
            }, []);

            const stopResizing = useCallback(() => {
                isResizing.current = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', stopResizing);
            }, []);

            // Highlight & Notes popover
            const handleMouseUp = (e) => {
                const target = e.target;
                if (target.classList.contains('ielts-highlight')) {
                    const rect = target.getBoundingClientRect();
                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 40,
                        y: rect.top + window.scrollY - 55,
                        mode: 'delete',
                        node: target,
                        text: ''
                    });
                    return;
                }

                const selection = window.getSelection();
                if (selection && selection.toString().trim().length > 0) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 60,
                        y: rect.top + window.scrollY - 55,
                        mode: 'create',
                        node: null,
                        text: selection.toString().trim()
                    });
                } else if (!e.target.closest('.idp-popover')) {
                    setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
                }
            };

            const applyHighlight = () => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = 'ielts-highlight';
                span.appendChild(range.extractContents());
                range.insertNode(span);
                selection.removeAllRanges();
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const removeHighlight = () => {
                if (popover.node) {
                    const parent = popover.node.parentNode;
                    while (popover.node.firstChild) {
                        parent.insertBefore(popover.node.firstChild, popover.node);
                    }
                    parent.removeChild(popover.node);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const handleCreateNote = () => {
                setIsNotesOpen(true);
                if (popover.text) {
                    setNotesText(prev => prev ? `${prev}\n- ${popover.text}` : `- ${popover.text}`);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            // Anti-cheat detection
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement && !isSubmitted) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }

                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
