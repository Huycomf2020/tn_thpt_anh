<!DOCTYPE html>
<html lang="vi">
<head>

    <title>KỲ THI TỐT NGHIỆP THPT - MÔN TIẾNG ANH - ĐỀ SỐ 02</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');

            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .selectable-text {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        .aplus-brand {
            color: #0f5132;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .header-top {
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .part-header-banner {
            background-color: #f3f4f6;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            color: #1f2937;
            font-weight: 500;
        }

        .main-workspace {
            flex: 1;

        }

            overflow-y: auto;

        .questions-pane {
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
        }

        .resizer {
            width: 8px;
            background: #e5e7eb;
            cursor: col-resize;
            transition: background 0.2s;

            z-index: 10;
        }
        .resizer:hover, .resizer.resizing {

        }

        .ielts-highlight {
            background-color: #fef08a;
            color: #1e293b;
            padding: 0 2px;
            border-radius: 2px;
            cursor: pointer;
        }

        .idp-popover {
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            z-index: 100;
            padding: 4px;
        }

        .idp-popover-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #4b5563;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .idp-popover-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .test-footer {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .nav-part-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
            border: none;
            transition: all 0.2s;
        }

        .nav-part-btn.active {
            color: #0f5132;
            background-color: #e8f5e9;
        }

        .q-square {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #9ca3af;
            border-radius: 3px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            margin: 0 2px;
        }

        .q-square.answered {
            background-color: #0f5132;
            color: #ffffff;
            font-weight: 700;
            border-color: #0f5132;
        }

        .q-square.active {
            border: 2px solid #f97316;
            color: #f97316;
            font-weight: 700;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        .idp-radio-label {
            display: flex;
            align-items: flex-start;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            margin-bottom: 6px;
            transition: all 0.15s;
        }
        .idp-radio-label:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }
        .idp-radio-label.selected {
            background-color: #f0fdf4;
            border-color: #16a34a;
        }
        .idp-radio-label input[type="radio"] {
            margin-top: 3px;
            margin-right: 12px;
            accent-color: #0f5132;
            width: 16px;
            height: 16px;
        }
    </style>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUv3CY-PXc2OjS69BQ1K0Xz6s4YQisQYruj_J29K0kqIL5feLRInX3rb5c2sXn0uj_/exec";

        const CORRECT_ANSWERS = {

            7: "B", 8: "B", 9: "A", 10: "C", 11: "A", 12: "B",
            13: "A", 14: "A", 15: "D", 16: "B", 17: "C",

        const EXPLANATIONS = {

            8: "Phrasal verb 'take up' nghĩa là bắt đầu thực hiện/áp dụng thói quen mới.",
            9: "Cụm liên kết 'In addition to' (ngoài ra/bên cạnh) thể hiện mối quan hệ bổ sung.",

            12: "Cụm 'the number of' đi với danh từ đếm được số nhiều chỉ người 'people'.",

            14: "Mạch hội thoại rủ rê: Mai rủ (a) -> Tuấn đồng ý (b) -> Mai dặn dò (c) -> Tuấn lên bài đăng (d) -> Mai khen (e).",
            15: "Cấu trúc thư đề nghị: Mở đầu nêu lý do (e) -> Thực trạng (b) -> Đề xuất (a) -> Tác động (c) -> Hy vọng (d).",
            16: "Mạch văn logic: Nêu thực trạng phá rừng (a) -> Hậu quả trực tiếp (d) -> Hệ quả mở rộng (b) -> Giải pháp cộng đồng (c) -> Chính sách (e).",
            17: "Hội thoại phỏng vấn: Đưa thông tin (a) -> Hỏi nguyên nhân (b) -> Trả lời chi tiết (c) -> Hỏi giải pháp (d) -> Khẳng định (e).",

            26: "'Contamination' (ô nhiễm/làm bẩn) trái nghĩa với 'purification' (sự làm sạch/thanh lọc).",

            28: "Đoạn 4 nhấn mạnh các giải pháp môi trường đòi hỏi sự phối hợp giữa nhiều tổ chức (Cơ quan nhà nước, tư nhân, cộng đồng).",
            29: "Các tác động về sức khỏe (bệnh đường hô hấp, tim mạch, tử vong sớm) nằm ở Đoạn 2.",

            32: "'Axit hóa đại dương' được đề cập ở đoạn 3 (môi trường biển), KHÔNG phải biểu hiện biến đổi khí hậu ở đoạn 2.",
            33: "Đoạn 3 nói về suy giảm đa dạng sinh học do phá rừng, ô nhiễm và sự suy thoái môi trường biển do axit hóa/nhựa.",
            34: "'This reality' quy chiếu trực tiếp vế trước về lựa chọn cá nhân và sự can thiệp chính sách hệ thống.",
            35: "'Unprecedented' (chưa từng có, vô tiền khoáng hậu) đồng nghĩa với 'unparalleled'.",
            36: "Diễn giải chính xác ý câu gạch chân trong đoạn 4 về hành vi cá nhân và chính sách doanh nghiệp/chính phủ.",
            37: "Từ 'formidable' (nghiêm trọng/nan giải) trái nghĩa với 'manageable' (có thể kiểm soát/quản lý được).",
            38: "Theo đoạn 3, môi trường biển suy thoái nghiêm trọng do axit hóa và ô nhiễm nhựa đe dọa chuỗi thức ăn.",
            39: "Suy luận từ bài đọc: Việc giải quyết biến đổi khí hậu đòi hỏi chuyển biến cả về hành vi cá nhân lẫn chính sách thể chế.",
            40: "Tóm tắt bao quát toàn bài: Hoạt động con người gây biến đổi khí hậu & mất đa dạng sinh học, đòi hỏi giải pháp phối hợp cá nhân lẫn hệ thống."
        };

        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh / Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-black text-[#0f5132] tracking-wide">TRUNG TÂM NGOẠI NGỮ APLUS</h2>
                            <p className="text-xs text-gray-500 font-semibold uppercase tracking-wider">Kỳ Thi Tốt Nghiệp THPT Quốc Gia</p>
                            <h1 className="text-2xl font-black text-gray-800 mt-2">MÔN TIẾNG ANH - ĐỀ SỐ 02</h1>
                            <p className="text-xs text-gray-600 mt-1">Thời gian làm bài: 50 phút | Mã đề: 1126</p>
                        </div>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="block w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#0f5132] focus:border-[#0f5132] text-sm" 
                                    placeholder="Ví dụ: 12A1 / TS2026"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="block w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#0f5132] focus:border-[#0f5132] text-sm" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>

                        <div className="mt-4 bg-amber-50 p-3 rounded-lg border border-amber-200 text-xs text-amber-800">
                            <strong>⚠️ Lưu ý kỳ thi:</strong> Bật chế độ Toàn màn hình (Fullscreen). Hệ thống sẽ tự động ghi nhận nếu thí sinh chuyển tab hoặc thoát màn hình làm bài.
                        </div>
                        
                        {error && <p className="text-red-500 text-xs mt-3 text-center font-bold">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3.5 rounded-lg font-bold hover:bg-[#0b3d26] transition-colors shadow-lg flex items-center justify-center space-x-2"
                        >
                            <span>BẮT ĐẦU LÀM BÀI (FULLSCREEN)</span>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(50 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [showWarningModal, setShowWarningModal] = useState(false);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');
            const [isNotesOpen, setIsNotesOpen] = useState(false);
            const [notesText, setNotesText] = useState('');

            // Resizable split pane width percentage
            const [leftWidth, setLeftWidth] = useState(48);
            const isResizing = useRef(false);

            const [popover, setPopover] = useState({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });

            const reEnterFullscreen = () => {
                const elem = document.documentElement;
                if (!document.fullscreenElement && elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleCloseWarningModal = () => {
                setShowWarningModal(false);
                reEnterFullscreen();
            };

            // Anti copy & context menu
            useEffect(() => {
                const preventDefault = (e) => e.preventDefault();
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                };
            }, []);

            // Resizer handlers
            const startResizing = useCallback((e) => {
                isResizing.current = true;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', stopResizing);
            }, []);

            const handleMouseMove = useCallback((e) => {
                if (!isResizing.current) return;
                const newWidth = (e.clientX / window.innerWidth) * 100;
                if (newWidth > 20 && newWidth < 80) {
                    setLeftWidth(newWidth);
                }
            }, []);

            const stopResizing = useCallback(() => {
                isResizing.current = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', stopResizing);
            }, []);

            // Highlight & Notes popover
            const handleMouseUp = (e) => {
                const target = e.target;
                if (target.classList.contains('ielts-highlight')) {
                    const rect = target.getBoundingClientRect();
                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 40,
                        y: rect.top + window.scrollY - 55,
                        mode: 'delete',
                        node: target,
                        text: ''
                    });
                    return;
                }

                const selection = window.getSelection();
                if (selection && selection.toString().trim().length > 0) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 60,
                        y: rect.top + window.scrollY - 55,
                        mode: 'create',
                        node: null,
                        text: selection.toString().trim()
                    });
                } else if (!e.target.closest('.idp-popover')) {
                    setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
                }
            };

            const applyHighlight = () => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = 'ielts-highlight';
                span.appendChild(range.extractContents());
                range.insertNode(span);
                selection.removeAllRanges();
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const removeHighlight = () => {
                if (popover.node) {
                    const parent = popover.node.parentNode;
                    while (popover.node.firstChild) {
                        parent.insertBefore(popover.node.firstChild, popover.node);
                    }
                    parent.removeChild(popover.node);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const handleCreateNote = () => {
                setIsNotesOpen(true);
                if (popover.text) {
                    setNotesText(prev => prev ? `${prev}\n- ${popover.text}` : `- ${popover.text}`);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            // Anti-cheat detection
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement && !isSubmitted) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState, isSubmitted]);

            // Countdown timer
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitTest();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [appState, isSubmitted]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                reEnterFullscreen();
            };

            const handleAnswerChange = (qNum, val) => {
                setAnswers(prev => ({ ...prev, [qNum]: val }));
            };

            const countPartAnswered = (start, end) => {
                let cnt = 0;
                for (let i = start; i <= end; i++) {
                    if (answers[i]) cnt++;
                }
                return cnt;
            };
